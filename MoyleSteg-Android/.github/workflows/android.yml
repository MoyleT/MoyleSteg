name: Kotlin core and Android debug build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - run: python tools/build_android.py
      - run: python -m pip install Pillow cryptography
      - run: python tools/verify_python.py core/build/interop-output
      - uses: actions/upload-artifact@v4
        with:
          name: MoyleSteg-debug-untested-on-device
          path: app/build/outputs/apk/debug/app-debug.apk
